plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.+'
}

repositories {
    maven {
        url = 'https://masa.dy.fi/maven/sakura-ryoko'
        content { includeGroupAndSubgroups('fi.dy.masa') }
    }
    maven {
        url = 'https://maven.fallenbreath.me/releases'
        content { includeGroupAndSubgroups('me.fallenbreath') }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup('maven.modrinth') }
    }
    maven {
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroupAndSubgroups('com.terraformersmc') }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "com.google.code.findbugs:jsr305:3.0.2"

    implementation "fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.malilib_version}"
    implementation "fi.dy.masa.litematica:litematica-fabric-${project.minecraft_version}:${project.litematica_version}"
    implementation "maven.modrinth:litematica-printer:${project.printer_modrinth_version}"

    // MaLiLib needs Fabric API at runtime anyway (networking, resource loading)
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "com.terraformersmc:modmenu:${project.mod_menu_version}"
}

// Automated in-game tests: ./gradlew runClientGameTest (needs a display; use xvfb-run on a server)
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "${project.mod_id}_test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

base {
    archivesName = "${project.mod_id}-${project.minecraft_version}"
    // Two editions from one source: "mythian" (default, for the Mythian server: every speed setting open) and
    // "official" (Modrinth: moves and clicks like a player; faster speeds only by choice, with warnings). -Pedition=official
    version = project.mod_version + (project.findProperty('edition') == 'official' ? '' : '+mythian')
    group = project.maven_group
}

processResources {
    def edition = project.findProperty('edition') ?: 'mythian'
    inputs.property 'mod_version', project.mod_version
    inputs.property 'edition', edition
    filesMatching('fabric.mod.json') {
        expand 'mod_version': project.mod_version + (edition == 'official' ? '' : '+mythian'), 'edition': edition
    }
    // The test build library, for the in-game tests (Tests tab)
    from('testdata/library') {
        include '*.litematic'
        into 'printer_addon/testbuilds'
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    from('LICENSE.md') {
        rename { "${it}_${project.mod_id}" }
    }
}

// Writes every setting's name and description to build/config-strings.json (for the translation files)
tasks.register('dumpConfigStrings', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'no.sindrens.printeraddon.config.DumpStrings'
    args file("$buildDir/config-strings.json").absolutePath
}
